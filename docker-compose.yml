name: sitey

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitey_dev_parola}
      POSTGRES_DB: ${POSTGRES_DB:-sitey}
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitey} -d ${POSTGRES_DB:-sitey}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Europe/Istanbul}
      DATABASE_URL: ${DATABASE_URL}
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:-}
      DB_RLS: ${DB_RLS:-off}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_PORT: 3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3100}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Site Yönetimi <noreply@example.com>}
      SMS_DRIVER: ${SMS_DRIVER:-mock}
      WHATSAPP_DRIVER: ${WHATSAPP_DRIVER:-mock}
      VOICE_DRIVER: ${VOICE_DRIVER:-mock}
      PAYMENT_DRIVER: ${PAYMENT_DRIVER:-mock}
    ports:
      - "${API_PORT:-3101}:3001"
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3101}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Europe/Istanbul}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3101}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      PORT: 3000
    ports:
      - "${WEB_PORT:-3100}:3000"

volumes:
  pgdata:
  redisdata:
  storage:
